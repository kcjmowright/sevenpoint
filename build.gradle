plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.flywaydb.flyway' version '6.4.3'
}

group = 'com.kcjmowright.financials'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

flyway {
	url = 'jdbc:postgresql://localhost:5432/sevenpoint'
	user = 'postgres'
	locations = ['classpath:db/migration']
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	mavenLocal()
}

// ext {
// 	set('springAiVersion', "1.0.0-M1")
// }

dependencies {
	//implementation 'org.springframework.boot:spring-boot-starter-security'
	// implementation 'org.springframework.ai:spring-ai-pgvector-store-spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation group: 'com.opencsv', name: 'opencsv', version: '5.9'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation('com.kcjmowright.schwab:schwab-marketdata-client:0.0.1') {
		exclude group: 'com.fasterxml.jackson.core'
		exclude group: 'com.fasterxml.jackson.jaxrs'
		exclude group: 'org.springframework'
	}
	implementation('com.kcjmowright.schwab:schwab-trader-client:0.0.1') {
		exclude group: 'com.fasterxml.jackson.core'
		exclude group: 'com.fasterxml.jackson.jaxrs'
		exclude group: 'org.springframework'
	}
	compileOnly 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// dependencyManagement {
// 	imports {
// 		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
// 	}
// }

bootJar {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test') {
	useJUnitPlatform()
}

task printRuntimeClasspath {
    def runtimeClasspath = sourceSets.main.runtimeClasspath
    inputs.files( runtimeClasspath )
    doLast {
        println runtimeClasspath.join( File.pathSeparator )
    }
}
